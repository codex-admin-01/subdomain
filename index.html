
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubHub - Premium Subdomain Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-color: #06080a;
            color: white;
        }
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='noiseFilter'%3e%3cturbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3e%3c/svg%3e");
        }
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, #0a0c10 0%, #06080a 100%);
            overflow: hidden;
        }
        .aurora-glow {
            position: absolute;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.2;
            animation: drift 25s infinite alternate ease-in-out;
        }
        .glow-1 { background: #059669; top: -20%; left: -20%; }
        .glow-2 { background: #0891b2; bottom: -20%; right: -20%; animation-delay: -7s; }
        .glow-3 { background: #2563eb; top: 40%; left: 30%; animation-delay: -15s; opacity: 0.1; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(200px, 100px) scale(1.2) rotate(45deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.3);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="aurora-bg">
        <div class="aurora-glow glow-1"></div>
        <div class="aurora-glow glow-2"></div>
        <div class="aurora-glow glow-3"></div>
    </div>
    <div id="root" style="position: relative; z-index: 1;"></div>
</body>
</html>
